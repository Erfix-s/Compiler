name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          mkdir -p _project
          if [ -n "$ZIP" ]; then
            echo "Using ZIP: $ZIP"
            unzip -q -o "$ZIP" -d _project
          else
            rsync -a --exclude '_project' --exclude '.git' ./ _project/
          fi
          SETTINGS="$(find _project -maxdepth 4 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found inside the ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PyStudio-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PyStudio build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
