
name: Build and release PyStudio

on:
  push:
    paths:
      - "PyStudio-Android.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f PyStudio-Android.zip
          unzip -tq PyStudio-Android.zip
          rm -rf app-src release
          mkdir -p app-src release
          unzip -q PyStudio-Android.zip -d app-src

          test -f app-src/settings.gradle
          test -f app-src/build.gradle
          test -f app-src/app/build.gradle
          test -f app-src/app/src/main/AndroidManifest.xml
          test -f app-src/signing/release.pk8
          test -f app-src/signing/release.cert.pem

          grep -Fq 'id "com.android.application" version "9.5.0" apply false' app-src/build.gradle
          grep -Fq 'id "com.chaquo.python" version "17.2.0" apply false' app-src/build.gradle
          grep -Fq 'compileSdk = 37' app-src/app/build.gradle
          grep -Fq 'com.google.android.material:material:1.14.0' app-src/app/build.gradle
          grep -Fq 'applicationId "com.pystudio.ide"' app-src/app/build.gradle

          openssl pkey -inform DER -in app-src/signing/release.pk8 -pubout -out "$RUNNER_TEMP/key.pub"
          openssl x509 -in app-src/signing/release.cert.pem -pubkey -noout -out "$RUNNER_TEMP/cert.pub"
          diff -u "$RUNNER_TEMP/key.pub" "$RUNNER_TEMP/cert.pub"

          echo "Project validation successful."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"
          cache-cleanup: on-success

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/37.0.0/apksigner"

          java --version
          python --version

      - name: Build release APK
        working-directory: app-src
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean assembleRelease

      - name: Sign and verify APK
        id: package
        shell: bash
        env:
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/37.0.0"

          APK="$(find app-src/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Unsigned APK not found."
            find app-src/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          ALIGNED="$RUNNER_TEMP/PyStudio-aligned.apk"
          OUTPUT="release/PyStudio-v${VERSION_NAME}.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --key app-src/signing/release.pk8 \
            --cert app-src/signing/release.cert.pem \
            --min-sdk-version 26 \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT"

          rm -f "$ALIGNED"

          (cd release && sha256sum *.apk > SHA256SUMS.txt)

          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PyStudio-v${{ steps.package.outputs.version }}
          path: |
            release/*.apk
            release/*.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: PyStudio v${{ steps.package.outputs.version }}
          body: |
            PyStudio - Python editor and compiler for Android.

            Version: v${{ steps.package.outputs.version }}
            Application ID: com.pystudio.ide
            Python: 3.10

            Includes NumPy, OpenCV, Matplotlib and Pillow.

            Check SHA256SUMS.txt for the APK checksum.
          files: |
            release/*.apk
            release/*.txt
          fail_on_unmatched_files: true
          make_latest: true
